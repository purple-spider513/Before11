name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      ok: ${{ steps.pages_site.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable GitHub Pages from Actions
        id: pages_site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          echo '[]' > /tmp/pages-attempts.json
          call() {
            local method="$1"
            local payload="$2"
            local status
            status=$(curl -sS -o /tmp/pages-body.json -w "%{http_code}" \
              -X "$method" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              -d "$payload") || status="curl_error"
            local body
            body=$(cat /tmp/pages-body.json 2>/dev/null || true)
            echo "${method} /pages -> ${status}" >&2
            printf '%s\n' "$body" >&2
            jq -n \
              --argjson attempts "$(cat /tmp/pages-attempts.json)" \
              --arg method "$method" \
              --arg status "$status" \
              --arg body "$body" \
              '$attempts + [{method:$method, http_status:$status, body:$body}]' \
              > /tmp/pages-attempts.json
            printf '%s' "$status" > /tmp/pages-status.txt
          }

          call POST '{"build_type":"workflow"}'
          code=$(cat /tmp/pages-status.txt)
          if [ "$code" = "409" ]; then
            call PUT '{"build_type":"workflow","source":{"branch":"main","path":"/"}}'
            code=$(cat /tmp/pages-status.txt)
          fi

          mkdir -p .github
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --argjson attempts "$(cat /tmp/pages-attempts.json)" \
            '{repository:$repo, visibility:"private", attempts:$attempts}' \
            > .github/pages-api-result.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-api-result.json
          if git diff --cached --quiet; then
            echo "Pages API result unchanged"
          else
            git commit -m "Record GitHub Pages API result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          case "$code" in
            200|201|204)
              echo "ok=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac

  build:
    needs: enable-pages
    if: needs.enable-pages.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
